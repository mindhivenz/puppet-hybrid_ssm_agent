name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VOXBOX_IMAGE: ghcr.io/voxpupuli/voxbox:10.1.0-openvox8.30.0@sha256:01bb8ce5e24d5b111934660f75e2786b4d7c7adcaa7518a564856d1d3041d10d

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task: [validate, lint, rubocop, spec]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/repo" "$VOXBOX_IMAGE" ${{ matrix.task }}
